<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GREX Login</title>

    <link rel="stylesheet" href="GREXLogStyle.css">
</head>

<body>

    <div class="login-container">

        <h1>GREX Login</h1>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="button" onclick="login()">
            Login
        </button>

        <p id="message"></p>

        <p class="account-link">
            Don't have an account?
            <a href="createAccount.html">
                Create One
            </a>
        </p>

    </div>

    <script src="GREXLogScript.js"></script>

</body>
</html>
