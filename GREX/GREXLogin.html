<!DOCTYPE html>
<html>
<head>
    <title>GREX Login</title>
    <link rel="stylesheet" href="GREXLogStyle.css">
</head>
<body>

<div class="login-container">

    <h1>GREX Login</h1>

    <input type="email"
           id="email"
           placeholder="Email">

    <input type="password"
           id="password"
           placeholder="Password">

    <button onclick="login()">
        Login
    </button>

    <p class="account-link">
        Don't have an account?
        <a href="createAccount.html">
            Create One
        </a>
    </p>

</div>

<script src="GREXLogScript.js"></script>

</body>
</html>
