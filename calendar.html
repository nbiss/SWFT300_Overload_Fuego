<!DOCTYPE html>
<html>
<head>
    <title>GREX Calendar</title>
    <link rel="stylesheet" href="homePageStyle.css">
    <link rel="stylesheet" href="calendar.css">
    
</head>
<body>
    <div class = "sidebar">
        <nav class="navbox">
            <button class="pictureBtn" id ="homePage"><img src="pictures/GrexLogo.png" alt="homePage"></button>
            
            <a href="homePage.html" class="navBtn" id ="teams">Teams</a>
            <a href="calendar.html" class="navBtn">Calendar</a>
             <a href="filesPage.html" class="navBtn" id="files">Files</a>
            <a href=""    class="navBtn" id ="inbox">Inbox</a>
            

            <button class="navBtn settingsBtn" id="settings"><img src="pictures/settingsGear.png" alt=""></button>
        </nav>
    </div>

    <div class="pageHeader">Calendar</div>

    <div class="calendar-page">

        

        <p id="userInfo"></p>

        <section id="createEventSection">
            <h2>Create Event</h2>

            <form id="eventForm">
                <input
                    type="text"
                    id="eventTitle"
                    placeholder="Event title"
                    required
                >

                <input
                    type="date"
                    id="eventDate"
                    required
                >

                <input
                    type="time"
                    id="eventTime"
                    required
                >

                <input
                    type="text"
                    id="eventLocation"
                    placeholder="Location"
                    required
                >

                <textarea
                    id="eventDescription"
                    placeholder="Description"
                ></textarea>

                <select id="teamSelect">
                    <option value="">Select team</option>
                </select>

                <button type="submit">
                    Add Event
                </button>
            </form>
        </section>

        <section>
            <h2>Upcoming Events</h2>
            <div id="eventsContainer"></div>
        </section>

    </div>

<script src="calendar.js"></script>

</body>
</html>
