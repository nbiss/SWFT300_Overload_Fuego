<!DOCTYPE html>
<html>
<head>
    <title>GREX Calendar</title>
    <link rel="stylesheet" href="calendar.css">
</head>
<body>

<main class="calendar-page">

    <h1>GREX Calendar</h1>

    <p id="userInfo"></p>

    <section id="createEventSection">
        <h2>Create Event</h2>

        <form id="eventForm">
            <input
                type="text"
                id="eventTitle"
                placeholder="Event title"
                required
            >

            <input
                type="date"
                id="eventDate"
                required
            >

            <input
                type="time"
                id="eventTime"
                required
            >

            <input
                type="text"
                id="eventLocation"
                placeholder="Location"
                required
            >

            <textarea
                id="eventDescription"
                placeholder="Description"
            ></textarea>

            <select id="teamSelect">
                <option value="">Select team</option>
            </select>

            <button type="submit">
                Add Event
            </button>
        </form>
    </section>

    <section>
        <h2>Upcoming Events</h2>
        <div id="eventsContainer"></div>
    </section>

</main>

<script src="calendar.js"></script>

</body>
</html>
