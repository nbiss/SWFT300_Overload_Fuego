<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .login-container {
            width: 320px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        input,
        select,
        button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            font-size: 14px;
        }

        button {
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        #message {
            margin-top: 15px;
            color: #333;
        }

        .account-link {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Create Account</h1>

        <form id="createAccountForm">

            <input
                type="text"
                id="firstName"
                placeholder="First Name"
                required
            >

            <input
                type="text"
                id="lastName"
                placeholder="Last Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <select id="role" required>
                <option value="">Select Role</option>
                <option value="Athlete">Athlete</option>
                <option value="Coach">Coach</option>
            </select>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <p class="account-link">
            Already have an account?
            <a href="javascript:history.back()">Login</a>
        </p>

    </div>

    <script>
        document
            .getElementById("createAccountForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const message = document.getElementById("message");

                const account = {
                    firstName: document
                        .getElementById("firstName")
                        .value
                        .trim(),

                    lastName: document
                        .getElementById("lastName")
                        .value
                        .trim(),

                    email: document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase(),

                    password: document
                        .getElementById("password")
                        .value,

                    role: document
                        .getElementById("role")
                        .value
                };

                message.textContent = "Creating account...";

                google.script.run
                    .withSuccessHandler(function(result) {
                        if (!result.success) {
                            message.textContent = result.message;
                            return;
                        }

                        message.textContent =
                            "Account created successfully.";

                        document
                            .getElementById("createAccountForm")
                            .reset();
                    })
                    .withFailureHandler(function(error) {
                        console.error(error);
                        message.textContent =
                            "Server error: " + error.message;
                    })
                    .createAccount(account);
            });
    </script>

</body>
</html>
